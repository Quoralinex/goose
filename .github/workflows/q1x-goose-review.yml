name: Q1X Goose Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  q1x-review:
    if: ${{ github.event.pull_request.draft == false }}
    uses: Quoralinex/goose/.github/workflows/q1x-pr-review.yml@814d84296791440902c6b9f01efd5b5a8706fad1
    with:
      pr_number: ${{ github.event.pull_request.number }}
      head_sha: ${{ github.event.pull_request.head.sha }}
