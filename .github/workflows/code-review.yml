name: Code Review (Normal Chat Orchestrated)

# Q1X policy:
# - Ordinary ChatGPT chat is the primary/supervising review surface.
# - Goose is the independent review worker.
# - No independent model/provider is assumed or defaulted here.
# - Provider execution remains fail-closed until an explicitly approved reviewer is configured.
env:
  GOOSE_REVIEW_ORCHESTRATOR: normal-chat
  GOOSE_REVIEW_ORCHESTRATOR_MODEL: gpt-5.6
  GOOSE_REVIEW_ORCHESTRATOR_REASONING_MODE: standard
  GOOSE_REVIEW_ORCHESTRATOR_REASONING_EFFORT: high
  GOOSE_THINKING_EFFORT: high

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'PR number to review in the calling repository'
        required: true
        type: number
      review_instructions:
        description: 'Instructions for the independent code review'
        required: false
        default: 'Review the changes for correctness'
        type: string
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review in this repository'
        required: true
        type: number
      review_instructions:
        description: 'Instructions for the independent code review'
        required: false
        default: 'Review the changes for correctness'
        type: string

concurrency:
  group: goose-code-review-${{ github.repository }}-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Record reviewer orchestration contract
        run: |
          test "$GOOSE_REVIEW_ORCHESTRATOR" = "normal-chat"
          test "$GOOSE_REVIEW_ORCHESTRATOR_MODEL" = "gpt-5.6"
          test "$GOOSE_REVIEW_ORCHESTRATOR_REASONING_MODE" = "standard"
          test "$GOOSE_REVIEW_ORCHESTRATOR_REASONING_EFFORT" = "high"
          test "$GOOSE_THINKING_EFFORT" = "high"
          printf '%s\n' \
            "orchestrator=$GOOSE_REVIEW_ORCHESTRATOR" \
            "orchestrator_model=$GOOSE_REVIEW_ORCHESTRATOR_MODEL" \
            "orchestrator_reasoning_mode=$GOOSE_REVIEW_ORCHESTRATOR_REASONING_MODE" \
            "orchestrator_reasoning_effort=$GOOSE_REVIEW_ORCHESTRATOR_REASONING_EFFORT" \
            "goose_thinking_effort=$GOOSE_THINKING_EFFORT" \
            "target_repository=$GITHUB_REPOSITORY"

      - name: Gather PR metadata and diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          mkdir -p /tmp/code-review
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq '.title' > /tmp/code-review/title.txt
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // "(no description)"' > /tmp/code-review/body.txt
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid' > /tmp/code-review/commit_id.txt
          gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" > /tmp/code-review/pr.diff
          TITLE=$(cat /tmp/code-review/title.txt)
          BODY=$(cat /tmp/code-review/body.txt)
          printf '# %s\n\n## Description\n\n%s\n' "$TITLE" "$BODY" > /tmp/code-review/pr.md

      - name: Upload review inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-review-inputs
          path: /tmp/code-review/
          retention-days: 1

  independent-reviewer-quarantine:
    needs: prepare
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Refuse unapproved independent reviewer execution
        run: |
          echo "The inherited Anthropic/Claude independent reviewer has been removed."
          echo "No replacement independent reviewer is approved/configured yet."
          echo "Failing closed rather than selecting a provider or model implicitly."
          exit 1
