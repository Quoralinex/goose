name: Q1X PR Review

on:
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number in the calling repository
        required: true
        type: number
      head_sha:
        description: Exact pull request head SHA
        required: true
        type: string
      require_independent_assurance:
        description: Fail closed unless at least one configured independent assurance control completes cleanly
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number in this repository
        required: true
        type: number
      head_sha:
        description: Exact pull request head SHA
        required: true
        type: string
      require_independent_assurance:
        description: Require configured independent assurance
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  group: q1x-pr-review-${{ github.repository }}-${{ inputs.pr_number }}-${{ inputs.head_sha }}
  cancel-in-progress: true

jobs:
  exact-head-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact-head review contract
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.head_sha }}
          # Trusted semantic reviewer identity is supplied by repository variables and verified by exact-head attestation checks.
          TRUSTED_REVIEWER_APP_ID: ${{ vars.Q1X_REVIEWER_APP_ID }}
          TRUSTED_REVIEWER_APP_SLUG: ${{ vars.Q1X_REVIEWER_APP_SLUG }}
        run: |
          set -euo pipefail
          actual_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)"
          test "$actual_head" = "$EXPECTED_HEAD"
          test -n "$TRUSTED_REVIEWER_APP_ID"
          test -n "$TRUSTED_REVIEWER_APP_SLUG"
          printf '%s\n' \
            'primary_review_surface=ordinary-chat' \
            'primary_review_model=gpt-5.6' \
            'primary_review_effort=high' \
            'independent_reviewer=goose' \
            'independent_review_provider=ordinary-chat' \
            'independent_review_model=gpt-5.6' \
            'independent_review_effort=high' \
            'semantic_evidence_transport=trusted-github-check-run-attestation' \
            'semantic_commit_status_fallback=false' \
            'semantic_attestation_schema=q1x.semantic-review-attestation.v1' \
            'codex_semantic_review_authority=false' \
            'work_chat_dependency=false' \
            'codex_cloud_reviewer_dependency=false' \
            'anthropic_dependency=false' \
            "trusted_reviewer_app_id=$TRUSTED_REVIEWER_APP_ID" \
            "trusted_reviewer_app_slug=$TRUSTED_REVIEWER_APP_SLUG" \
            "repository=$GITHUB_REPOSITORY" \
            "pr=$PR_NUMBER" \
            "head=$EXPECTED_HEAD"

  assurance-evidence:
    needs: exact-head-contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - name: Verify PR head and create two-stage semantic-review request packet
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/q1x-review
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > /tmp/q1x-review/pr.json
          test "$(jq -r .head.sha /tmp/q1x-review/pr.json)" = "$EXPECTED_HEAD"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson pr "$PR_NUMBER" \
            --arg head "$EXPECTED_HEAD" \
            '{
              schema: "q1x.two-stage-semantic-review-request.v2",
              repository: $repository,
              pullRequestNumber: $pr,
              exactHead: $head,
              primary: {
                reviewer: "ordinary-chat",
                model: "gpt-5.6",
                effort: "high",
                requiredCheckRun: "q1x/ordinary-chat-primary"
              },
              independent: {
                reviewer: "goose",
                provider: "ordinary-chat",
                model: "gpt-5.6",
                effort: "high",
                requiredCheckRun: "q1x/goose-independent-review",
                mustFollowPrimary: true,
                mustBindPrimaryAttestationDigest: true
              },
              attestation: {
                schema: "q1x.semantic-review-attestation.v1",
                transport: "github-check-run-output-summary",
                trustedPublisher: "repository-configured-github-app",
                digestAlgorithm: "sha256",
                canonicalization: "utf8-json-sort-keys-compact",
                commitStatusFallbackAllowed: false,
                directVerdictConsumptionRequired: true
              },
              prohibitedSemanticProviders: ["codex", "work-chat", "anthropic", "ollama", "paid-api-substitute"]
            }' > /tmp/q1x-review/ordinary-chat-review-request.json

      - name: Wait for verified digest-bound Ordinary Chat and Goose attestations
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.head_sha }}
          TRUSTED_REVIEWER_APP_ID: ${{ vars.Q1X_REVIEWER_APP_ID }}
          TRUSTED_REVIEWER_APP_SLUG: ${{ vars.Q1X_REVIEWER_APP_SLUG }}
        run: |
          set -euo pipefail
          test -n "$TRUSTED_REVIEWER_APP_ID"
          test -n "$TRUSTED_REVIEWER_APP_SLUG"

          cat > /tmp/q1x-review/verify_semantic_attestations.py <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          from pathlib import Path

          CHECKS = Path("/tmp/q1x-review/semantic-check-runs.json")
          OUT = Path("/tmp/q1x-review/semantic-review-result.json")
          PRIMARY = Path("/tmp/q1x-review/primary-attestation.json")
          GOOSE = Path("/tmp/q1x-review/goose-attestation.json")

          repo = os.environ["GITHUB_REPOSITORY"]
          pr = int(os.environ["PR_NUMBER"])
          head = os.environ["EXPECTED_HEAD"]
          app_id = str(os.environ["TRUSTED_REVIEWER_APP_ID"])
          app_slug = os.environ["TRUSTED_REVIEWER_APP_SLUG"]

          def canonical_digest(payload):
              body = dict(payload)
              body.pop("attestationDigest", None)
              encoded = json.dumps(
                  body,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
              ).encode("utf-8")
              return "sha256:" + hashlib.sha256(encoded).hexdigest()

          def select_check(checks, name):
              matches = []
              for check in checks:
                  app = check.get("app") or {}
                  if (
                      check.get("name") == name
                      and check.get("status") == "completed"
                      and check.get("head_sha") == head
                      and str(app.get("id")) == app_id
                      and app.get("slug") == app_slug
                  ):
                      matches.append(check)
              if not matches:
                  return None
              matches.sort(key=lambda item: (
                  item.get("completed_at") or "",
                  item.get("id") or 0,
              ))
              return matches[-1]

          def parse_attestation(check, expected):
              output = check.get("output") or {}
              summary = output.get("summary")
              if not isinstance(summary, str) or not summary.strip():
                  raise ValueError(f"{expected['stage']}: trusted check run has no JSON output.summary")
              try:
                  att = json.loads(summary)
              except json.JSONDecodeError as exc:
                  raise ValueError(f"{expected['stage']}: output.summary is not JSON: {exc}") from exc
              required = {
                  "schema": "q1x.semantic-review-attestation.v1",
                  "repository": repo,
                  "pullRequestNumber": pr,
                  "exactHead": head,
                  "stage": expected["stage"],
                  "reviewer": expected["reviewer"],
                  "surface": "ordinary-chat",
                  "model": "gpt-5.6",
                  "effort": "high",
              }
              for key, value in required.items():
                  if att.get(key) != value:
                      raise ValueError(
                          f"{expected['stage']}: {key} mismatch "
                          f"(expected {value!r}, got {att.get(key)!r})"
                      )
              for key in ("packetId", "evidenceDigest", "attestationDigest", "verdict"):
                  if not isinstance(att.get(key), str) or not att[key]:
                      raise ValueError(f"{expected['stage']}: missing {key}")
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", att["evidenceDigest"]):
                  raise ValueError(f"{expected['stage']}: invalid evidenceDigest")
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", att["attestationDigest"]):
                  raise ValueError(f"{expected['stage']}: invalid attestationDigest")
              computed = canonical_digest(att)
              if att["attestationDigest"] != computed:
                  raise ValueError(
                      f"{expected['stage']}: attestation digest mismatch "
                      f"(expected {computed}, got {att['attestationDigest']})"
                  )
              if att["verdict"] not in {"pass", "findings", "abstain"}:
                  raise ValueError(f"{expected['stage']}: invalid verdict {att['verdict']!r}")
              return att

          payload = json.loads(CHECKS.read_text())
          checks = payload.get("check_runs") or []
          primary_check = select_check(checks, "q1x/ordinary-chat-primary")
          goose_check = select_check(checks, "q1x/goose-independent-review")
          if primary_check is None or goose_check is None:
              sys.exit(2)

          try:
              primary = parse_attestation(
                  primary_check,
                  {"stage": "ordinary-chat-primary", "reviewer": "ordinary-chat"},
              )
              goose = parse_attestation(
                  goose_check,
                  {"stage": "goose-independent", "reviewer": "goose"},
              )

              if primary_check.get("conclusion") != "success":
                  raise ValueError("ordinary-chat-primary: trusted check conclusion is not success")
              if goose_check.get("conclusion") != "success":
                  raise ValueError("goose-independent: trusted check conclusion is not success")
              primary_completed = primary_check.get("completed_at")
              goose_completed = goose_check.get("completed_at")
              if not primary_completed or not goose_completed:
                  raise ValueError("trusted semantic checks must both include completed_at")
              if goose_completed <= primary_completed:
                  raise ValueError(
                      "goose-independent: completed_at must be strictly later than "
                      "ordinary-chat-primary completed_at"
                  )
              if primary["verdict"] != "pass":
                  raise ValueError(
                      f"ordinary-chat-primary: direct verdict is {primary['verdict']!r}, not pass"
                  )
              if goose["verdict"] != "pass":
                  raise ValueError(
                      f"goose-independent: direct verdict is {goose['verdict']!r}, not pass"
                  )
              if goose.get("primaryAttestationDigest") != primary["attestationDigest"]:
                  raise ValueError(
                      "goose-independent: primaryAttestationDigest does not bind "
                      "the accepted primary attestation"
                  )
              for key in ("advisoryId", "runtimePin"):
                  if not isinstance(goose.get(key), str) or not goose[key]:
                      raise ValueError(f"goose-independent: missing governed Goose {key}")

              PRIMARY.write_text(json.dumps(primary, sort_keys=True, indent=2) + "\n")
              GOOSE.write_text(json.dumps(goose, sort_keys=True, indent=2) + "\n")
              result = {
                  "schema": "q1x.two-stage-semantic-review-result.v2",
                  "state": "completed-clean",
                  "exactHead": head,
                  "trustedPublisher": {
                      "appId": app_id,
                      "appSlug": app_slug,
                  },
                  "primary": {
                      "checkRunId": primary_check.get("id"),
                      "completedAt": primary_completed,
                      "attestationDigest": primary["attestationDigest"],
                      "evidenceDigest": primary["evidenceDigest"],
                      "verdict": primary["verdict"],
                      "packetId": primary["packetId"],
                  },
                  "goose": {
                      "checkRunId": goose_check.get("id"),
                      "completedAt": goose_completed,
                      "attestationDigest": goose["attestationDigest"],
                      "evidenceDigest": goose["evidenceDigest"],
                      "verdict": goose["verdict"],
                      "packetId": goose["packetId"],
                      "advisoryId": goose["advisoryId"],
                      "runtimePin": goose["runtimePin"],
                      "primaryAttestationDigest": goose["primaryAttestationDigest"],
                  },
              }
              OUT.write_text(json.dumps(result, sort_keys=True, indent=2) + "\n")
          except ValueError as exc:
              result = {
                  "schema": "q1x.two-stage-semantic-review-result.v2",
                  "state": "invalid-attestation",
                  "exactHead": head,
                  "error": str(exc),
              }
              OUT.write_text(json.dumps(result, sort_keys=True, indent=2) + "\n")
              print(str(exc), file=sys.stderr)
              sys.exit(3)
          PY

          collect_check_runs() {
            gh api --paginate --slurp -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_HEAD/check-runs?per_page=100" \
              | jq '{check_runs: [.[].check_runs[]]}'
          }

          result_code=1
          state='timeout-pending'
          for attempt in $(seq 1 61); do
            collect_check_runs > /tmp/q1x-review/semantic-check-runs.json

            set +e
            python3 /tmp/q1x-review/verify_semantic_attestations.py
            verifier_code=$?
            set -e

            if [ "$verifier_code" -eq 0 ]; then
              state='completed-clean'
              result_code=0
              break
            fi
            if [ "$verifier_code" -eq 3 ]; then
              state='invalid-attestation'
              break
            fi
            if [ "$attempt" -eq 61 ]; then
              break
            fi
            sleep 20
          done

          if [ "$result_code" -ne 0 ]; then
            if [ ! -f /tmp/q1x-review/semantic-review-result.json ]; then
              jq -n \
                --arg state "$state" \
                --arg head "$EXPECTED_HEAD" \
                '{schema:"q1x.two-stage-semantic-review-result.v2", state:$state, exactHead:$head}' \
                > /tmp/q1x-review/semantic-review-result.json
            fi
            echo "Verified two-stage semantic review failed closed: $state"
            cat /tmp/q1x-review/semantic-review-result.json
            exit "$result_code"
          fi

          cat /tmp/q1x-review/semantic-review-result.json

      - name: Wait for configured independent assurance and fail closed on adverse evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ inputs.head_sha }}
          REQUIRE_ASSURANCE: ${{ inputs.require_independent_assurance }}
        run: |
          set -euo pipefail
          regex='circleci|codeql|semgrep|trivy|gitleaks|sonar|snyk|codecov|security'
          result_code=1
          state='unknown'

          cat > /tmp/q1x-review/classify_assurance.py <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          ADVERSE_CHECK_CONCLUSIONS = {
              "failure",
              "cancelled",
              "timed_out",
              "action_required",
              "stale",
              "startup_failure",
          }
          ADVERSE_STATUS_STATES = {"failure", "error"}

          def classify(check_payload, status_payload, regex, require=True):
              matcher = re.compile(regex, re.IGNORECASE)
              checks = [
                  check
                  for check in check_payload.get("check_runs", [])
                  if matcher.search(check.get("name") or "")
              ]
              statuses = [
                  status
                  for status in status_payload.get("statuses", [])
                  if matcher.search(status.get("context") or "")
              ]

              relevant = len(checks) + len(statuses)
              pending = sum(check.get("status") != "completed" for check in checks)
              pending += sum(status.get("state") == "pending" for status in statuses)
              adverse = sum(
                  check.get("status") == "completed"
                  and check.get("conclusion") in ADVERSE_CHECK_CONCLUSIONS
                  for check in checks
              )
              adverse += sum(status.get("state") in ADVERSE_STATUS_STATES for status in statuses)
              successful = sum(
                  check.get("status") == "completed" and check.get("conclusion") == "success"
                  for check in checks
              )
              successful += sum(status.get("state") == "success" for status in statuses)

              if adverse:
                  state = "adverse"
              elif relevant == 0:
                  state = "no-configured-independent-assurance" if require else "not-required"
              elif pending:
                  state = "pending"
              elif require and successful == 0:
                  state = "no-successful-independent-assurance"
              else:
                  state = "completed-clean"

              return {
                  "schema": "q1x.independent-assurance-result.v1",
                  "state": state,
                  "relevantControls": relevant,
                  "pendingControls": pending,
                  "adverseControls": adverse,
                  "successfulControls": successful,
              }

          def self_test():
              regex = r"security"

              def check(status, conclusion):
                  return {"name": "security-test", "status": status, "conclusion": conclusion}

              def state(checks=(), statuses=(), require=True):
                  result = classify(
                      {"check_runs": list(checks)},
                      {"statuses": [{"context": "security-status", "state": value} for value in statuses]},
                      regex,
                      require,
                  )
                  return result["state"]

              cases = {
                  "absent": (state(), "no-configured-independent-assurance"),
                  "pending": (state(checks=[check("in_progress", None)]), "pending"),
                  "success": (state(checks=[check("completed", "success")]), "completed-clean"),
                  "skipped": (state(checks=[check("completed", "skipped")]), "no-successful-independent-assurance"),
                  "neutral": (state(checks=[check("completed", "neutral")]), "no-successful-independent-assurance"),
                  "adverse": (state(checks=[check("completed", "failure")]), "adverse"),
                  "mixed-clean": (
                      state(checks=[check("completed", "success"), check("completed", "neutral")]),
                      "completed-clean",
                  ),
                  "mixed-adverse": (
                      state(checks=[check("completed", "success"), check("completed", "failure")]),
                      "adverse",
                  ),
              }
              for name, (actual, expected) in cases.items():
                  if actual != expected:
                      raise AssertionError(f"{name}: expected {expected}, got {actual}")
              print("assurance classifier self-tests: pass")

          if __name__ == "__main__":
              if sys.argv[1:] == ["--self-test"]:
                  self_test()
              else:
                  checks = json.loads(Path(sys.argv[1]).read_text())
                  statuses = json.loads(Path(sys.argv[2]).read_text())
                  result = classify(checks, statuses, sys.argv[3], sys.argv[4].lower() == "true")
                  print(json.dumps(result, sort_keys=True))
          PY

          python3 /tmp/q1x-review/classify_assurance.py --self-test

          collect_check_runs() {
            gh api --paginate --slurp -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_HEAD/check-runs?per_page=100" \
              | jq '{check_runs: [.[].check_runs[]]}'
          }

          for attempt in $(seq 1 46); do
            collect_check_runs > /tmp/q1x-review/check-runs.json
            gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_HEAD/status" \
              > /tmp/q1x-review/status.json

            python3 /tmp/q1x-review/classify_assurance.py \
              /tmp/q1x-review/check-runs.json \
              /tmp/q1x-review/status.json \
              "$regex" \
              "$REQUIRE_ASSURANCE" \
              > /tmp/q1x-review/assurance-result.json

            state="$(jq -r .state /tmp/q1x-review/assurance-result.json)"

            case "$state" in
              adverse|no-successful-independent-assurance)
                result_code=1
                break
                ;;
              no-configured-independent-assurance)
                if [ "$attempt" -lt 3 ]; then
                  sleep 15
                  continue
                fi
                result_code=1
                break
                ;;
              not-required|completed-clean)
                result_code=0
                break
                ;;
              pending)
                if [ "$attempt" -eq 46 ]; then
                  state='timeout-pending'
                  jq '.state = "timeout-pending"' /tmp/q1x-review/assurance-result.json \
                    > /tmp/q1x-review/assurance-result.tmp
                  mv /tmp/q1x-review/assurance-result.tmp /tmp/q1x-review/assurance-result.json
                  result_code=1
                  break
                fi
                sleep 20
                ;;
              *)
                state='classifier-error'
                result_code=1
                break
                ;;
            esac
          done

          if [ "$result_code" -ne 0 ]; then
            echo "Independent assurance failed closed: $state"
            jq --arg re "$regex" '[.check_runs[] | select(.name | test($re; "i")) | {name, status, conclusion, app: (.app.slug // null), details_url}]' /tmp/q1x-review/check-runs.json || true
            jq --arg re "$regex" '[.statuses[]? | select(.context | test($re; "i")) | {context, state, target_url}]' /tmp/q1x-review/status.json || true
            exit "$result_code"
          fi

          echo "Independent assurance state: $state"

      - name: Record exact-head assurance summary
        if: always()
        env:
          EXPECTED_HEAD: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          test -f /tmp/q1x-review/check-runs.json || echo '{"check_runs":[]}' > /tmp/q1x-review/check-runs.json
          test -f /tmp/q1x-review/status.json || echo '{"statuses":[]}' > /tmp/q1x-review/status.json
          test -f /tmp/q1x-review/assurance-result.json || echo '{"schema":"q1x.independent-assurance-result.v1","state":"collection-error","relevantControls":0,"pendingControls":0,"adverseControls":0,"successfulControls":0}' > /tmp/q1x-review/assurance-result.json
          test -f /tmp/q1x-review/semantic-review-result.json || echo '{"schema":"q1x.two-stage-semantic-review-result.v2","state":"collection-error"}' > /tmp/q1x-review/semantic-review-result.json
          jq -n \
            --arg head "$EXPECTED_HEAD" \
            --slurpfile checks /tmp/q1x-review/check-runs.json \
            --slurpfile status /tmp/q1x-review/status.json \
            --slurpfile result /tmp/q1x-review/assurance-result.json \
            --slurpfile semantic /tmp/q1x-review/semantic-review-result.json \
            '{
              schema: "q1x.independent-assurance-evidence.v2",
              exactHead: $head,
              semanticReview: $semantic[0],
              assurance: $result[0],
              checks: [$checks[0].check_runs[] | {name, status, conclusion, app: {id: (.app.id // null), slug: (.app.slug // null)}, details_url}],
              statuses: [$status[0].statuses[]? | {context, state, target_url}]
            }' > /tmp/q1x-review/assurance-summary.json

      - name: Upload exact-head review packet and assurance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: q1x-review-evidence-${{ inputs.pr_number }}-${{ inputs.head_sha }}
          path: /tmp/q1x-review
          retention-days: 14

  ordinary-chat-dispatch-boundary:
    needs: assurance-evidence
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the real Ordinary-Chat boundary
        run: |
          echo 'The installed Q1X PR Reviewer — Ordinary Chat app is the approved primary semantic-review surface.'
          echo 'The governed reviewer bridge must publish exact-head, digest-bound attestations through the configured trusted GitHub App.'
          echo 'The Goose independent verdict is consumed directly only after its attestation binds the accepted primary attestation digest.'
          echo 'Codex may initiate or transport the workflow but has no semantic-review authority. Work Chat, Anthropic, Ollama and API-billed substitutes are not semantic providers.'
