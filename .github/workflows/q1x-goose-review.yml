name: Q1X Goose Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  q1x-review:
    if: ${{ github.event.pull_request.draft == false }}
    uses: Quoralinex/goose/.github/workflows/q1x-pr-review.yml@c7203d2e03bd92fd955c2f20441bb4fc232d2026
    with:
      pr_number: ${{ github.event.pull_request.number }}
      head_sha: ${{ github.event.pull_request.head.sha }}
