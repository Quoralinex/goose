name: Q1X Central Independent Assurance

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  secret-scan:
    # Required for organization ruleset execution across repositories.
    if: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact proposed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the commit range
        id: range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          test -n "$merge_base"
          test "$(git rev-list --count "${merge_base}..${HEAD_SHA}")" -gt 0
          printf 'range=%s..%s\n' "$merge_base" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Download the pinned secret scanner
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error --retry 2 \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          printf '%s  %s\n' \
            79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e \
            "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          test "$("$RUNNER_TEMP/gitleaks" version)" = 8.30.0

      - name: Scan proposed commits with fixed rules
        env:
          COMMIT_RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -euo pipefail
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/q1x-gitleaks.toml"
          : > "$RUNNER_TEMP/q1x-gitleaks-ignore"
          repo_ignore="$PWD/.gitleaksignore"
          if [[ -e "$repo_ignore" || -L "$repo_ignore" ]]; then
            ignored_repo_file="$(mktemp -d "$RUNNER_TEMP/q1x-gitleaks-ignore.XXXXXX")/.gitleaksignore"
            mv -- "$repo_ignore" "$ignored_repo_file"
            trap 'mv -- "$ignored_repo_file" "$repo_ignore"' EXIT
          fi
          "$RUNNER_TEMP/gitleaks" git . \
            --log-opts "--text -m --no-ext-diff --no-textconv $COMMIT_RANGE" \
            --config "$RUNNER_TEMP/q1x-gitleaks.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/q1x-gitleaks-ignore" \
            --ignore-gitleaks-allow \
            --redact=100 \
            --no-banner \
            --no-color \
            --timeout 600
