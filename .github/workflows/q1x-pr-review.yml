name: Q1X PR Review

on:
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number in the calling repository
        required: true
        type: number
      head_sha:
        description: Exact pull request head SHA
        required: true
        type: string
      require_independent_assurance:
        description: Fail closed unless at least one configured independent assurance control completes cleanly
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number in this repository
        required: true
        type: number
      head_sha:
        description: Exact pull request head SHA
        required: true
        type: string
      require_independent_assurance:
        description: Require configured independent assurance
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  group: q1x-pr-review-${{ github.repository }}-${{ inputs.pr_number }}-${{ inputs.head_sha }}
  cancel-in-progress: true

jobs:
  exact-head-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact-head review contract
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          actual_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)"
          test "$actual_head" = "$EXPECTED_HEAD"
          printf '%s\n' \
            'primary_review_surface=ordinary-chat' \
            'primary_review_model=gpt-5.6' \
            'primary_review_effort=high' \
            'independent_reviewer=goose' \
            'independent_review_provider=ordinary-chat' \
            'independent_review_model=gpt-5.6' \
            'independent_review_effort=high' \
            'codex_semantic_review_authority=false' \
            'work_chat_dependency=false' \
            'codex_cloud_reviewer_dependency=false' \
            'anthropic_dependency=false' \
            "repository=$GITHUB_REPOSITORY" \
            "pr=$PR_NUMBER" \
            "head=$EXPECTED_HEAD"

  assurance-evidence:
    needs: exact-head-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - name: Verify PR head and create Ordinary-Chat primary-review request packet
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/q1x-review
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > /tmp/q1x-review/pr.json
          test "$(jq -r .head.sha /tmp/q1x-review/pr.json)" = "$EXPECTED_HEAD"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson pr "$PR_NUMBER" \
            --arg head "$EXPECTED_HEAD" \
            '{
              schema: "q1x.two-stage-semantic-review-request.v1",
              repository: $repository,
              pullRequestNumber: $pr,
              exactHead: $head,
              primary: {
                reviewer: "ordinary-chat",
                model: "GPT-5.6",
                effort: "High",
                requiredStatus: "q1x/ordinary-chat-primary"
              },
              independent: {
                reviewer: "goose",
                provider: "ordinary-chat",
                model: "GPT-5.6",
                effort: "High",
                requiredStatus: "q1x/goose-independent-review",
                mustFollowPrimary: true
              },
              prohibitedSemanticProviders: ["codex", "work-chat", "anthropic", "ollama", "paid-api-substitute"]
            }' > /tmp/q1x-review/ordinary-chat-review-request.json

      - name: Wait for Ordinary Chat primary and Goose independent semantic review
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ inputs.head_sha }}
        run: |
          set -u
          primary_context='q1x/ordinary-chat-primary'
          goose_context='q1x/goose-independent-review'
          result_code=1
          state='timeout-pending'
          primary_time=''
          goose_time=''

          for attempt in $(seq 1 61); do
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_HEAD/check-runs?per_page=100" \
              > /tmp/q1x-review/semantic-check-runs.json
            gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_HEAD/status" \
              > /tmp/q1x-review/semantic-status.json

            adverse="$(jq --arg p "$primary_context" --arg g "$goose_context" '[.check_runs[] | select((.name == $p) or (.name == $g)) | select(.status == "completed") | select(.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped")] | length' /tmp/q1x-review/semantic-check-runs.json)"
            adverse_status="$(jq --arg p "$primary_context" --arg g "$goose_context" '[.statuses[]? | select((.context == $p) or (.context == $g)) | select(.state == "failure" or .state == "error")] | length' /tmp/q1x-review/semantic-status.json)"
            if [ $((adverse + adverse_status)) -gt 0 ]; then
              state='adverse'
              break
            fi

            primary_time="$( { jq -r --arg c "$primary_context" '.check_runs[] | select(.name == $c and .status == "completed" and .conclusion == "success") | .completed_at // empty' /tmp/q1x-review/semantic-check-runs.json; jq -r --arg c "$primary_context" '.statuses[]? | select(.context == $c and .state == "success") | .updated_at // .created_at // empty' /tmp/q1x-review/semantic-status.json; } | grep -E '.+' | sort | tail -1 )"
            goose_time="$( { jq -r --arg c "$goose_context" '.check_runs[] | select(.name == $c and .status == "completed" and .conclusion == "success") | .completed_at // empty' /tmp/q1x-review/semantic-check-runs.json; jq -r --arg c "$goose_context" '.statuses[]? | select(.context == $c and .state == "success") | .updated_at // .created_at // empty' /tmp/q1x-review/semantic-status.json; } | grep -E '.+' | sort | tail -1 )"

            if [ -n "$primary_time" ] && [ -n "$goose_time" ]; then
              if [[ "$goose_time" < "$primary_time" ]]; then
                state='invalid-order'
                break
              fi
              state='completed-clean'
              result_code=0
              break
            fi

            sleep 20
          done

          jq -n \
            --arg state "$state" \
            --arg primaryContext "$primary_context" \
            --arg gooseContext "$goose_context" \
            --arg primaryCompletedAt "$primary_time" \
            --arg gooseCompletedAt "$goose_time" \
            '{schema:"q1x.two-stage-semantic-review-result.v1", state:$state, primaryContext:$primaryContext, gooseContext:$gooseContext, primaryCompletedAt:$primaryCompletedAt, gooseCompletedAt:$gooseCompletedAt}' \
            > /tmp/q1x-review/semantic-review-result.json

          if [ "$result_code" -ne 0 ]; then
            echo "Two-stage semantic review failed closed: $state"
            exit "$result_code"
          fi

      - name: Wait for configured independent assurance and fail closed on adverse evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ inputs.head_sha }}
          REQUIRE_ASSURANCE: ${{ inputs.require_independent_assurance }}
        run: |
          set -u
          regex='circleci|codeql|semgrep|trivy|gitleaks|sonar|snyk|codecov|security'
          result_code=0
          state='unknown'
          relevant=0
          pending=0
          adverse=0

          for attempt in $(seq 1 46); do
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_HEAD/check-runs?per_page=100" \
              > /tmp/q1x-review/check-runs.json
            gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_HEAD/status" \
              > /tmp/q1x-review/status.json

            relevant_checks="$(jq --arg re "$regex" '[.check_runs[] | select(.name | test($re; "i"))] | length' /tmp/q1x-review/check-runs.json)"
            relevant_statuses="$(jq --arg re "$regex" '[.statuses[]? | select(.context | test($re; "i"))] | length' /tmp/q1x-review/status.json)"
            pending_checks="$(jq --arg re "$regex" '[.check_runs[] | select(.name | test($re; "i")) | select(.status != "completed")] | length' /tmp/q1x-review/check-runs.json)"
            pending_statuses="$(jq --arg re "$regex" '[.statuses[]? | select(.context | test($re; "i")) | select(.state == "pending")] | length' /tmp/q1x-review/status.json)"
            adverse_checks="$(jq --arg re "$regex" '[.check_runs[] | select(.name | test($re; "i")) | select(.status == "completed") | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required" or .conclusion == "stale")] | length' /tmp/q1x-review/check-runs.json)"
            adverse_statuses="$(jq --arg re "$regex" '[.statuses[]? | select(.context | test($re; "i")) | select(.state == "failure" or .state == "error")] | length' /tmp/q1x-review/status.json)"

            relevant=$((relevant_checks + relevant_statuses))
            pending=$((pending_checks + pending_statuses))
            adverse=$((adverse_checks + adverse_statuses))

            if [ "$adverse" -gt 0 ]; then
              state='adverse'
              result_code=1
              break
            fi

            if [ "$relevant" -eq 0 ]; then
              if [ "$attempt" -lt 3 ]; then
                sleep 15
                continue
              fi
              if [ "$REQUIRE_ASSURANCE" = "true" ]; then
                state='no-configured-independent-assurance'
                result_code=1
              else
                state='not-required'
                result_code=0
              fi
              break
            fi

            if [ "$pending" -eq 0 ]; then
              state='completed-clean'
              break
            fi

            if [ "$attempt" -eq 46 ]; then
              state='timeout-pending'
              result_code=1
              break
            fi

            sleep 20
          done

          jq -n \
            --arg state "$state" \
            --argjson relevant "$relevant" \
            --argjson pending "$pending" \
            --argjson adverse "$adverse" \
            '{schema:"q1x.independent-assurance-result.v1", state:$state, relevantControls:$relevant, pendingControls:$pending, adverseControls:$adverse}' \
            > /tmp/q1x-review/assurance-result.json

          if [ "$result_code" -ne 0 ]; then
            echo "Independent assurance failed closed: $state"
            jq --arg re "$regex" '[.check_runs[] | select(.name | test($re; "i")) | {name, status, conclusion, app: (.app.slug // null), details_url}]' /tmp/q1x-review/check-runs.json || true
            jq --arg re "$regex" '[.statuses[]? | select(.context | test($re; "i")) | {context, state, target_url}]' /tmp/q1x-review/status.json || true
            exit "$result_code"
          fi

          echo "Independent assurance state: $state"

      - name: Record exact-head assurance summary
        if: always()
        env:
          EXPECTED_HEAD: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          test -f /tmp/q1x-review/check-runs.json || echo '{"check_runs":[]}' > /tmp/q1x-review/check-runs.json
          test -f /tmp/q1x-review/status.json || echo '{"statuses":[]}' > /tmp/q1x-review/status.json
          test -f /tmp/q1x-review/assurance-result.json || echo '{"schema":"q1x.independent-assurance-result.v1","state":"collection-error","relevantControls":0,"pendingControls":0,"adverseControls":0}' > /tmp/q1x-review/assurance-result.json
          test -f /tmp/q1x-review/semantic-review-result.json || echo '{"schema":"q1x.two-stage-semantic-review-result.v1","state":"collection-error"}' > /tmp/q1x-review/semantic-review-result.json
          jq -n \
            --arg head "$EXPECTED_HEAD" \
            --slurpfile checks /tmp/q1x-review/check-runs.json \
            --slurpfile status /tmp/q1x-review/status.json \
            --slurpfile result /tmp/q1x-review/assurance-result.json \
            --slurpfile semantic /tmp/q1x-review/semantic-review-result.json \
            '{
              schema: "q1x.independent-assurance-evidence.v1",
              exactHead: $head,
              semanticReview: $semantic[0],
              assurance: $result[0],
              checks: [$checks[0].check_runs[] | {name, status, conclusion, app: (.app.slug // null), details_url}],
              statuses: [$status[0].statuses[]? | {context, state, target_url}]
            }' > /tmp/q1x-review/assurance-summary.json

      - name: Upload exact-head review packet and assurance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: q1x-review-evidence-${{ inputs.pr_number }}-${{ inputs.head_sha }}
          path: /tmp/q1x-review
          retention-days: 14

  ordinary-chat-dispatch-boundary:
    needs: assurance-evidence
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the real Ordinary-Chat boundary
        run: |
          echo 'The installed Q1X PR Reviewer — Ordinary Chat app is the approved primary semantic-review surface.'
          echo 'GitHub Actions prepares the exact-head contract and requires Ordinary Chat primary review followed by Goose independent review on Ordinary Chat.'
          echo 'Codex may initiate or transport the workflow but has no semantic-review authority. Work Chat, Anthropic, Ollama and API-billed substitutes are not semantic providers.'
