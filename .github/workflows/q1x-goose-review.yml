name: Q1X Goose Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: read
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  q1x-review:
    if: ${{ github.event.pull_request.draft == false }}
    uses: Quoralinex/goose/.github/workflows/q1x-pr-review.yml@ac8ddc42392941f398d73a8bfdeb926964c54410
    with:
      pr_number: ${{ github.event.pull_request.number }}
      head_sha: ${{ github.event.pull_request.head.sha }}
