name: Q1X Goose Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  q1x-review:
    if: ${{ github.event.pull_request.draft == false }}
    uses: Quoralinex/goose/.github/workflows/q1x-pr-review.yml@49b47d83aee6baf21ac143bdc17daedba6a4c948
    with:
      pr_number: ${{ github.event.pull_request.number }}
      head_sha: ${{ github.event.pull_request.head.sha }}
