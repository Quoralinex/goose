name: Q1X PR Review

on:
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number in the calling repository
        required: true
        type: number
      head_sha:
        description: Exact pull request head SHA
        required: true
        type: string
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number in this repository
        required: true
        type: number
      head_sha:
        description: Exact pull request head SHA
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  group: q1x-pr-review-${{ github.repository }}-${{ inputs.pr_number }}-${{ inputs.head_sha }}
  cancel-in-progress: true

jobs:
  exact-head-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact-head review contract
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          actual_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)"
          test "$actual_head" = "$EXPECTED_HEAD"
          printf '%s\n' \
            'primary_review_surface=ordinary-chat' \
            'primary_review_model=gpt-5.6' \
            'primary_review_effort=high' \
            'work_chat_dependency=false' \
            'codex_cloud_reviewer_dependency=false' \
            'anthropic_dependency=false' \
            "repository=$GITHUB_REPOSITORY" \
            "pr=$PR_NUMBER" \
            "head=$EXPECTED_HEAD"

  assurance-evidence:
    needs: exact-head-contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - name: Collect exact-head CI and independent-assurance evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/q1x-review
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > /tmp/q1x-review/pr.json
          test "$(jq -r .head.sha /tmp/q1x-review/pr.json)" = "$EXPECTED_HEAD"
          gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_HEAD/check-runs?per_page=100" > /tmp/q1x-review/check-runs.json
          gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_HEAD/status" > /tmp/q1x-review/status.json

      - name: Create Ordinary-Chat primary-review request packet
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson pr "$PR_NUMBER" \
            --arg head "$EXPECTED_HEAD" \
            '{
              schema: "q1x.ordinary-chat-primary-review-request.v1",
              callingSurface: "ordinary-chat",
              reviewerModel: "GPT-5.6",
              reviewerEffort: "High",
              repository: $repository,
              pullRequestNumber: $pr,
              exactHead: $head,
              instructions: "Perform the primary semantic code review against this exact head. Do not use Work Chat, Codex Cloud automatic review, or Anthropic/Claude."
            }' > /tmp/q1x-review/ordinary-chat-review-request.json

      - name: Fail on completed adverse assurance checks
        run: |
          set -euo pipefail
          adverse_checks="$(jq '[.check_runs[] | select(.status == "completed") | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required") | select(.name | test("circleci|codeql|semgrep|trivy|gitleaks|sonar|snyk|codecov|security"; "i"))] | length' /tmp/q1x-review/check-runs.json)"
          adverse_statuses="$(jq '[.statuses[]? | select(.state == "failure" or .state == "error") | select(.context | test("circleci|codeql|semgrep|trivy|gitleaks|sonar|snyk|codecov|security"; "i"))] | length' /tmp/q1x-review/status.json)"
          if [ "$adverse_checks" -gt 0 ] || [ "$adverse_statuses" -gt 0 ]; then
            echo 'One or more configured independent assurance controls are adverse.'
            jq '[.check_runs[] | select(.status == "completed") | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required") | {name, conclusion, html_url}]' /tmp/q1x-review/check-runs.json
            jq '[.statuses[]? | select(.state == "failure" or .state == "error") | {context, state, target_url}]' /tmp/q1x-review/status.json
            exit 1
          fi
          echo 'No completed adverse CircleCI/security/quality assurance check is present on this exact head.'

      - name: Record assurance summary
        env:
          EXPECTED_HEAD: ${{ inputs.head_sha }}
        run: |
          jq -n \
            --arg head "$EXPECTED_HEAD" \
            --slurpfile checks /tmp/q1x-review/check-runs.json \
            --slurpfile status /tmp/q1x-review/status.json \
            '{
              schema: "q1x.independent-assurance-evidence.v1",
              exactHead: $head,
              checks: [$checks[0].check_runs[] | {name, status, conclusion, app: (.app.slug // null), details_url}],
              statuses: [$status[0].statuses[]? | {context, state, target_url}]
            }' > /tmp/q1x-review/assurance-summary.json

      - name: Upload exact-head review packet and assurance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: q1x-review-evidence-${{ inputs.pr_number }}-${{ inputs.head_sha }}
          path: /tmp/q1x-review
          retention-days: 14

  ordinary-chat-dispatch-boundary:
    needs: assurance-evidence
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the real Ordinary-Chat boundary
        run: |
          echo 'The installed Q1X PR Reviewer — Ordinary Chat app is the approved primary semantic-review surface.'
          echo 'GitHub Actions prepares the exact-head request and assurance evidence automatically.'
          echo 'This workflow does not substitute Codex, Work Chat, Anthropic, or an API-billed model for Ordinary Chat.'
